<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高三七班共享云盘</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 高三七班共享云盘</h1>
            <p id="header-subtitle">安全访问班级共享文件</p>
        </div>
        <div id="auth-section">
            <div class="input-group">
                <input type="password" id="password-input" placeholder="请输入访问密码" autofocus>
                <button id="submit-btn">验证</button>
            </div>
            <p id="error-msg" class="error-msg"></p>
        </div>
        <div id="files-section" class="hidden">
            <button id="logout-btn" class="logout-btn">← 退出登录</button>
            <div style="clear:both"></div>
            <div id="file-list-container"><div class="spinner"></div></div>
        </div>
    </div>

    <!-- 构建时由 GitHub Actions 替换 -->
    <script>
        const PUBLIC_KEY_JWK = {"kty":"RSA","n":"m71Bk-3O0ADhu2CuzfFfOhP_CPvkucJd8c7BItlFB0JVZwUMPaHsyevsIW5wolHntLNfotiv-nSkXmvAOEKPZCCmO97nb1G5b9_l3fnGJHhjgQgg5QAnkazb2EymaZpejhTGpQ2F1-G778QnkXHjeGccvWgTWuD7vXVpbA3E2K5a7LfqN-vRcHo1f9TroxkGU6IIO4TlaWi-eS44FA5WB1WspfNXDqKbCM5flX7d8D7oOYdnne5QNm0HavOT539DDBOSZqVct_mpguij8d7DTt_XXfXFMSxqxWkCdcU6-L42U0RZPC2wywq5p4UmyijSgURzzIqJv-x5MP6afoU3_Q","e":"AQAB"};
        const PASSWORD_HASH = "c697c9a00e1b761133de60921c2415ad805d984e6f43d1b8c1fffd96d1c0d58e";
        const SIGNATURE = "6fb7ad685e68050768aafa2cf46890a53910b3bc2d3cde858c035139f7acb250b9688f448f7666119e8be7a7e7dca3ccb55241c4582d1b57a3c19d0d97669a891ea993b458d088c43cf9a69fee3c825a16b9678c8c9dee9797c7434e520b58cdd6aa1afc1ca8291d7d03d2b5fb599e265d404195c1be8810ab3f70f8d905041df97ff0beb2e8f27ed101dfd648e62ccf4f846f29a42a9fb8f004f9cbb926c5158b0592c64211dfbb752363671b57615aa890b19048157dee029fd1176d99c12ed36fb938c4552f992dfbe6a4019cbf8e3ae153248fc85476a36174a7c291cc3acbcbe0e6648465bee845d6e7c2fb144e98a79da293d5cd52e3c8f94f7cf2ffb6";
        const WORKER_URL = "https://your-worker.workers.dev";
    </script>

    <script>
        (function() {
            // ========== 添加调试日志 ==========
            console.log("[DEBUG] 页面脚本已启动");
            console.log("[DEBUG] WORKER_URL =", WORKER_URL);
            console.log("[DEBUG] PASSWORD_HASH 存在?", !!PASSWORD_HASH);
            console.log("[DEBUG] SIGNATURE 存在?", !!SIGNATURE);
            console.log("[DEBUG] PUBLIC_KEY_JWK 存在?", !!PUBLIC_KEY_JWK);

            const authSection = document.getElementById('auth-section');
            const filesSection = document.getElementById('files-section');
            const passwordInput = document.getElementById('password-input');
            const submitBtn = document.getElementById('submit-btn');
            const errorMsg = document.getElementById('error-msg');
            const logoutBtn = document.getElementById('logout-btn');
            const fileListContainer = document.getElementById('file-list-container');
            const headerSubtitle = document.getElementById('header-subtitle');

            const STORAGE_KEY = 'device_token';

            // 工具函数
            function hexToBytes(hex) {
                const bytes = new Uint8Array(hex.length / 2);
                for (let i = 0; i < bytes.length; i++) {
                    bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
                }
                return bytes;
            }

            async function sha256(message) {
                console.log("[DEBUG] sha256 计算:", message.substring(0, 10) + "...");
                const msgBuffer = new TextEncoder().encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            async function verifySignature(publicKeyJwk, dataHex, signatureHex) {
                console.log("[DEBUG] 开始签名验证...");
                const key = await crypto.subtle.importKey(
                    'jwk', publicKeyJwk,
                    { name: 'RSASSA-PKCS1-v1_5', hash: { name: 'SHA-256' } },
                    false, ['verify']
                );
                const data = hexToBytes(dataHex);
                const signature = hexToBytes(signatureHex);
                const valid = await crypto.subtle.verify('RSASSA-PKCS1-v1_5', key, signature, data);
                console.log("[DEBUG] 签名验证结果:", valid);
                return valid;
            }

            function formatSize(bytes) {
                if (bytes === 0) return '0 B';
                const units = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(1024));
                return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
            }

            function formatTime(dateStr) {
                const d = new Date(dateStr);
                return d.toLocaleString('zh-CN', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                });
            }

            function escapeHtml(text) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return text.replace(/[&<>"']/g, m => map[m]);
            }

            function renderFiles(files) {
                console.log("[DEBUG] 渲染文件列表，文件数量:", files?.length);
                if (!files || files.length === 0) {
                    fileListContainer.innerHTML = '<p class="empty-message">📭 暂无共享文件</p>';
                    return;
                }
                let html = `<table class="file-table">
                    <thead><tr><th>文件名</th><th>大小</th><th>修改时间</th><th style="text-align:right">操作</th></tr></thead><tbody>`;
                files.forEach(file => {
                    html += `<tr>
                        <td>📄 ${escapeHtml(file.name)}</td>
                        <td class="file-size">${formatSize(file.size)}</td>
                        <td>${formatTime(file.mtime)}</td>
                        <td style="text-align:right">
                            <a class="download-btn" href="./data/${encodeURIComponent(file.name)}" download>下载</a>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                fileListContainer.innerHTML = html;
            }

            function getDeviceToken() {
                let token = localStorage.getItem(STORAGE_KEY);
                if (!token) {
                    token = crypto.randomUUID();
                    localStorage.setItem(STORAGE_KEY, token);
                    console.log("[DEBUG] 生成新设备令牌:", token);
                } else {
                    console.log("[DEBUG] 使用已有设备令牌:", token);
                }
                return token;
            }

            function clearDeviceToken() {
                console.log("[DEBUG] 清除设备令牌");
                localStorage.removeItem(STORAGE_KEY);
            }

            async function apiGet(path, token) {
                console.log(`[DEBUG] API GET ${path}，使用token:`, token);
                const resp = await fetch(`${WORKER_URL}${path}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!resp.ok) {
                    console.error(`[ERROR] API GET ${path} 失败: ${resp.status}`);
                    throw new Error(`API ${path} failed: ${resp.status}`);
                }
                const data = await resp.json();
                console.log(`[DEBUG] API GET ${path} 响应:`, data);
                return data;
            }

            async function apiPost(path, body) {
                console.log(`[DEBUG] API POST ${path}，body:`, body);
                const resp = await fetch(`${WORKER_URL}${path}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!resp.ok) {
                    console.error(`[ERROR] API POST ${path} 失败: ${resp.status}`);
                    throw new Error(`API ${path} failed: ${resp.status}`);
                }
                const data = await resp.json();
                console.log(`[DEBUG] API POST ${path} 响应:`, data);
                return data;
            }

            async function checkTokenValidity(token) {
                console.log("[DEBUG] 检查令牌有效性...");
                try {
                    const data = await apiGet('/api/check', token);
                    return data.valid === true;
                } catch (e) {
                    console.error('Token check failed', e);
                    return false;
                }
            }

            async function registerDeviceToken(token, deviceProof) {
                console.log("[DEBUG] 注册设备，token:", token);
                try {
                    const data = await apiPost('/api/register', { token, device_proof: deviceProof });
                    return data.success === true;
                } catch (e) {
                    console.error('Register failed', e);
                    return false;
                }
            }

            async function fetchFileList(token) {
                console.log("[DEBUG] 获取文件列表...");
                const data = await apiGet('/api/filelist', token);
                return data;
            }

            async function showFiles() {
                console.log("[DEBUG] 显示文件界面");
                authSection.classList.add('hidden');
                filesSection.classList.remove('hidden');
                fileListContainer.innerHTML = '<div class="spinner"></div>';
                const token = getDeviceToken();
                try {
                    const files = await fetchFileList(token);
                    renderFiles(files);
                    headerSubtitle.textContent = '安全访问班级共享文件';
                    console.log("[DEBUG] 文件列表加载成功");
                } catch (e) {
                    console.error("[ERROR] 加载文件列表失败:", e);
                    clearDeviceToken();
                    filesSection.classList.add('hidden');
                    authSection.classList.remove('hidden');
                    errorMsg.textContent = '登录已过期，请重新输入密码';
                    errorMsg.style.display = 'block';
                }
            }

            function logout() {
                console.log("[DEBUG] 用户退出登录");
                clearDeviceToken();
                filesSection.classList.add('hidden');
                authSection.classList.remove('hidden');
                passwordInput.value = '';
                errorMsg.style.display = 'none';
                passwordInput.focus();
            }

            async function handleSubmit() {
                const password = passwordInput.value.trim();
                console.log("[DEBUG] 提交密码验证，密码长度:", password.length);
                if (!password) {
                    errorMsg.textContent = '请输入密码';
                    errorMsg.style.display = 'block';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = '验证中...';
                errorMsg.style.display = 'none';

                try {
                    console.log("[DEBUG] 计算密码哈希...");
                    const inputHash = await sha256(password);
                    console.log("[DEBUG] 输入密码哈希:", inputHash);
                    console.log("[DEBUG] 内置密码哈希:", PASSWORD_HASH);
                    
                    console.log("[DEBUG] 验证签名...");
                    const isValid = await verifySignature(PUBLIC_KEY_JWK, PASSWORD_HASH, SIGNATURE);
                    console.log("[DEBUG] 签名验证结果:", isValid);
                    
                    if (isValid && inputHash === PASSWORD_HASH) {
                        console.log("[DEBUG] 密码验证通过");
                        const token = getDeviceToken();
                        const deviceProof = await sha256(PASSWORD_HASH + token);
                        console.log("[DEBUG] deviceProof 生成完成，准备注册设备");
                        const registered = await registerDeviceToken(token, deviceProof);
                        if (registered) {
                            console.log("[DEBUG] 设备注册成功，显示文件列表");
                            await showFiles();
                        } else {
                            console.error("[ERROR] 设备注册失败");
                            errorMsg.textContent = '设备注册失败，请刷新重试';
                            errorMsg.style.display = 'block';
                        }
                    } else {
                        console.warn("[WARN] 密码验证失败");
                        errorMsg.textContent = '密码错误，请重试';
                        errorMsg.style.display = 'block';
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                } catch (e) {
                    console.error("[ERROR] 验证过程异常:", e);
                    errorMsg.textContent = '验证失败，请刷新页面重试';
                    errorMsg.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '验证';
                }
            }

            async function init() {
                console.log("[DEBUG] 初始化页面...");
                const token = getDeviceToken();
                const valid = await checkTokenValidity(token);
                if (valid) {
                    console.log("[DEBUG] 令牌有效，自动显示文件列表");
                    await showFiles();
                } else {
                    console.log("[DEBUG] 令牌无效或已过期，显示登录界面");
                    clearDeviceToken();
                    authSection.classList.remove('hidden');
                    filesSection.classList.add('hidden');
                }
            }

            submitBtn.addEventListener('click', handleSubmit);
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleSubmit();
            });
            logoutBtn.addEventListener('click', logout);

            init();
        })();
    </script>
</body>
</html>
