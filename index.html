<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高三七班共享云盘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container {
            background: white; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            width: 100%; max-width: 900px; overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white; padding: 28px 32px; text-align: center;
        }
        .header h1 { font-size: 2rem; font-weight: 600; letter-spacing: 2px; }
        .header p { margin-top: 8px; opacity: 0.9; font-size: 0.95rem; }
        #auth-section, #files-section { padding: 32px; }
        .hidden { display: none !important; }
        .input-group { display: flex; gap: 12px; max-width: 400px; margin: 0 auto; }
        #password-input {
            flex: 1; padding: 14px 20px; border: 2px solid #e0e0e0; border-radius: 14px;
            font-size: 1rem; outline: none; transition: border-color 0.2s;
        }
        #password-input:focus { border-color: #2a5298; }
        #submit-btn {
            background: #2a5298; color: white; border: none; padding: 14px 28px;
            border-radius: 14px; font-weight: 600; font-size: 1rem; cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        #submit-btn:hover { background: #1e3c72; }
        #submit-btn:active { transform: scale(0.97); }
        .error-msg { color: #d32f2f; text-align: center; margin-top: 16px; font-weight: 500; display: none; }
        .file-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .file-table th { text-align: left; padding: 14px 12px; border-bottom: 2px solid #e0e0e0; color: #444; font-weight: 600; }
        .file-table td { padding: 14px 12px; border-bottom: 1px solid #eee; color: #555; }
        .file-table tr:hover td { background: #f8faff; }
        .download-btn {
            background: #2a5298; color: white; border: none; padding: 8px 20px; border-radius: 10px;
            font-weight: 500; cursor: pointer; text-decoration: none; display: inline-block;
        }
        .download-btn:hover { background: #1e3c72; }
        .file-size { white-space: nowrap; }
        .logout-btn {
            background: transparent; border: 1px solid #ccc; color: #555; padding: 8px 20px;
            border-radius: 10px; cursor: pointer; float: right; margin-bottom: 16px;
        }
        .logout-btn:hover { background: #f0f0f0; }
        .empty-message { text-align: center; color: #888; margin: 40px 0; }
        .spinner { text-align: center; margin: 40px 0; }
        .spinner::after {
            content: ''; display: inline-block; width: 30px; height: 30px;
            border: 3px solid #ccc; border-top-color: #2a5298; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 高三七班共享云盘</h1>
            <p id="header-subtitle">安全访问班级共享文件</p>
        </div>
        <div id="auth-section">
            <div class="input-group">
                <input type="password" id="password-input" placeholder="请输入访问密码" autofocus>
                <button id="submit-btn">验证</button>
            </div>
            <p id="error-msg" class="error-msg"></p>
        </div>
        <div id="files-section" class="hidden">
            <button id="logout-btn" class="logout-btn">← 退出登录</button>
            <div style="clear:both"></div>
            <div id="file-list-container"><div class="spinner"></div></div>
        </div>
    </div>

    <!-- 构建时由 GitHub Actions 替换 -->
    <script>
        const PUBLIC_KEY_JWK = __PUBLIC_KEY_JWK__;
        const PASSWORD_HASH = "__PASSWORD_HASH__";
        const SIGNATURE = "__SIGNATURE__";
        const WORKER_URL = "__WORKER_URL__";
    </script>

    <script>
        (function() {
            const authSection = document.getElementById('auth-section');
            const filesSection = document.getElementById('files-section');
            const passwordInput = document.getElementById('password-input');
            const submitBtn = document.getElementById('submit-btn');
            const errorMsg = document.getElementById('error-msg');
            const logoutBtn = document.getElementById('logout-btn');
            const fileListContainer = document.getElementById('file-list-container');
            const headerSubtitle = document.getElementById('header-subtitle');

            const STORAGE_KEY = 'device_token';

            // 工具函数
            function hexToBytes(hex) {
                const bytes = new Uint8Array(hex.length / 2);
                for (let i = 0; i < bytes.length; i++) {
                    bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
                }
                return bytes;
            }

            async function sha256(message) {
                const msgBuffer = new TextEncoder().encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            async function verifySignature(publicKeyJwk, dataHex, signatureHex) {
                const key = await crypto.subtle.importKey(
                    'jwk', publicKeyJwk,
                    { name: 'RSASSA-PKCS1-v1_5', hash: { name: 'SHA-256' } },
                    false, ['verify']
                );
                const data = hexToBytes(dataHex);
                const signature = hexToBytes(signatureHex);
                return crypto.subtle.verify('RSASSA-PKCS1-v1_5', key, signature, data);
            }

            function formatSize(bytes) {
                if (bytes === 0) return '0 B';
                const units = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(1024));
                return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
            }

            function formatTime(dateStr) {
                const d = new Date(dateStr);
                return d.toLocaleString('zh-CN', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                });
            }

            function escapeHtml(text) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return text.replace(/[&<>"']/g, m => map[m]);
            }

            function renderFiles(files) {
                if (!files || files.length === 0) {
                    fileListContainer.innerHTML = '<p class="empty-message">📭 暂无共享文件</p>';
                    return;
                }
                let html = `<table class="file-table">
                    <thead><tr><th>文件名</th><th>大小</th><th>修改时间</th><th style="text-align:right">操作</th></tr></thead><tbody>`;
                files.forEach(file => {
                    html += `<tr>
                        <td>📄 ${escapeHtml(file.name)}</td>
                        <td class="file-size">${formatSize(file.size)}</td>
                        <td>${formatTime(file.mtime)}</td>
                        <td style="text-align:right">
                            <a class="download-btn" href="./data/${encodeURIComponent(file.name)}" download>下载</a>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                fileListContainer.innerHTML = html;
            }

            // 获取或创建设备令牌
            function getDeviceToken() {
                let token = localStorage.getItem(STORAGE_KEY);
                if (!token) {
                    token = crypto.randomUUID();
                    localStorage.setItem(STORAGE_KEY, token);
                }
                return token;
            }

            function clearDeviceToken() {
                localStorage.removeItem(STORAGE_KEY);
            }

            // 发送带 Authorization 头的请求
            async function apiGet(path, token) {
                const resp = await fetch(`${WORKER_URL}${path}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!resp.ok) throw new Error(`API ${path} failed: ${resp.status}`);
                return resp.json();
            }

            async function apiPost(path, body) {
                const resp = await fetch(`${WORKER_URL}${path}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!resp.ok) throw new Error(`API ${path} failed: ${resp.status}`);
                return resp.json();
            }

            // 检查令牌有效性
            async function checkTokenValidity(token) {
                try {
                    const data = await apiGet('/api/check', token);
                    return data.valid === true;
                } catch (e) {
                    console.error('Token check failed', e);
                    return false;
                }
            }

            // 注册设备（需要 deviceProof）
            async function registerDeviceToken(token, deviceProof) {
                try {
                    const data = await apiPost('/api/register', { token, device_proof: deviceProof });
                    return data.success === true;
                } catch (e) {
                    console.error('Register failed', e);
                    return false;
                }
            }

            // 获取文件列表
            async function fetchFileList(token) {
                const data = await apiGet('/api/filelist', token);
                return data;
            }

            // 显示文件列表界面
            async function showFiles() {
                authSection.classList.add('hidden');
                filesSection.classList.remove('hidden');
                fileListContainer.innerHTML = '<div class="spinner"></div>';
                const token = getDeviceToken();
                try {
                    const files = await fetchFileList(token);
                    renderFiles(files);
                    headerSubtitle.textContent = '安全访问班级共享文件';
                } catch (e) {
                    clearDeviceToken();
                    filesSection.classList.add('hidden');
                    authSection.classList.remove('hidden');
                    errorMsg.textContent = '登录已过期，请重新输入密码';
                    errorMsg.style.display = 'block';
                }
            }

            // 退出登录
            function logout() {
                clearDeviceToken();
                filesSection.classList.add('hidden');
                authSection.classList.remove('hidden');
                passwordInput.value = '';
                errorMsg.style.display = 'none';
                passwordInput.focus();
            }

            // 处理密码验证
            async function handleSubmit() {
                const password = passwordInput.value.trim();
                if (!password) {
                    errorMsg.textContent = '请输入密码';
                    errorMsg.style.display = 'block';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = '验证中...';
                errorMsg.style.display = 'none';

                try {
                    const inputHash = await sha256(password);
                    const isValid = await verifySignature(PUBLIC_KEY_JWK, PASSWORD_HASH, SIGNATURE);
                    if (isValid && inputHash === PASSWORD_HASH) {
                        const token = getDeviceToken();
                        // 生成设备专属凭证
                        const deviceProof = await sha256(PASSWORD_HASH + token);
                        const registered = await registerDeviceToken(token, deviceProof);
                        if (registered) {
                            await showFiles();
                        } else {
                            errorMsg.textContent = '设备注册失败，请刷新重试';
                            errorMsg.style.display = 'block';
                        }
                    } else {
                        errorMsg.textContent = '密码错误，请重试';
                        errorMsg.style.display = 'block';
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                } catch (e) {
                    errorMsg.textContent = '验证失败，请刷新页面重试';
                    errorMsg.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '验证';
                }
            }

            // 初始化
            async function init() {
                const token = getDeviceToken();
                const valid = await checkTokenValidity(token);
                if (valid) {
                    await showFiles();
                } else {
                    clearDeviceToken();
                    authSection.classList.remove('hidden');
                    filesSection.classList.add('hidden');
                }
            }

            submitBtn.addEventListener('click', handleSubmit);
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleSubmit();
            });
            logoutBtn.addEventListener('click', logout);

            init();
        })();
    </script>
</body>
</html>
